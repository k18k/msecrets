name: Release Packages

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - run: npm run test

      - run: npm publish --workspace @msecrets/ts-sdk --access public --provenance

      - run: npm publish --workspace @msecrets/ui --access public --provenance
