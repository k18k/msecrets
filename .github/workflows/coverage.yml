name: Coverage

on:
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - ".github/badges/**"

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build

      - run: npm run coverage

      - name: Write Shields coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p .github/badges
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          const summary = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8"));
          const pct = summary.total.lines.pct;

          const color =
            pct >= 90 ? "brightgreen" :
            pct >= 80 ? "green" :
            pct >= 70 ? "yellowgreen" :
            pct >= 60 ? "yellow" :
            pct >= 50 ? "orange" :
            "red";

          const badge = {
            schemaVersion: 1,
            label: "coverage",
            message: `${pct.toFixed(2)}%`,
            color,
          };

          writeFileSync(".github/badges/coverage.json", `${JSON.stringify(badge, null, 2)}\n`);
          NODE

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet -- .github/badges/coverage.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          git commit -m "chore: update coverage badge"
          git push
