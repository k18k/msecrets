name: CI

on:
  pull_request:
  push:
    branches-ignore: [master, cli, "cli-*", ts-sdk]
  workflow_call:
  # Weekly: deeper fuzzing with a fresh seed (printed in the test names, to reproduce).
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AGE_VERSION: v1.3.2

jobs:
  check:
    name: Format, vet, build, install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Build every platform and the SDK
        run: scripts/build-dist.sh
      - name: Install from git branches (cli, cli-<os>-<arch>, ts-sdk)
        run: scripts/test-install.sh
      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }}, Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 26]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install the reference age implementation (interoperability tests)
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) asset="linux-amd64.tar.gz" ;;
            Linux-ARM64) asset="linux-arm64.tar.gz" ;;
            macOS-ARM64) asset="darwin-arm64.tar.gz" ;;
            macOS-X64) asset="darwin-amd64.tar.gz" ;;
            Windows-X64) asset="windows-amd64.zip" ;;
            *) echo "no age build for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/age-dist"
          curl -fsSL -o "$RUNNER_TEMP/age-archive" "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-${asset}"
          if [[ "$asset" == *.zip ]]; then unzip -q "$RUNNER_TEMP/age-archive" -d "$RUNNER_TEMP/age-dist"; else tar -xzf "$RUNNER_TEMP/age-archive" -C "$RUNNER_TEMP/age-dist"; fi
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          echo "MSECRETS_AGE_BIN=$RUNNER_TEMP/age-dist/age/age$ext" >> "$GITHUB_ENV"
          echo "MSECRETS_AGE_KEYGEN_BIN=$RUNNER_TEMP/age-dist/age/age-keygen$ext" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/age-dist/age/age$ext" --version
      - name: Go tests
        run: go test ./...
        env:
          MSECRETS_TEST_KEYCHAIN: ${{ runner.os != 'Linux' && '1' || '' }}
          MSECRETS_FUZZ_CASES: ${{ github.event_name == 'schedule' && '20000' || '' }}
          MSECRETS_FUZZ_SEED: ${{ github.event_name == 'schedule' && github.run_id || '' }}
      - name: SDK tests (WebAssembly)
        run: |
          MSECRETS_PLATFORMS= scripts/build-dist.sh
          node --test --test-timeout=120000 sdk/test/
