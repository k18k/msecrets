name: CI

on:
  pull_request:
  push:
    branches-ignore: [master, cli, "cli-*", ts-sdk]
  workflow_call:
  # Weekly: more mutation cases (MSECRETS_FUZZ_CASES).
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, vet, build, install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # test-install.sh pushes HEAD to a new repository
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Build every platform and the SDK
        run: scripts/build-dist.sh
      - name: Install from git branches (cli, cli-<os>-<arch>, ts-sdk)
        run: scripts/test-install.sh
      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }}, Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 26]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Go tests
        run: go test ./...
        env:
          MSECRETS_TEST_KEYCHAIN: ${{ runner.os != 'Linux' && '1' || '' }}
          MSECRETS_FUZZ_CASES: ${{ github.event_name == 'schedule' && '20000' || '' }}
      - name: SDK tests (WebAssembly)
        run: |
          MSECRETS_PLATFORMS= scripts/build-dist.sh
          node --test --test-timeout=120000 sdk/test/
