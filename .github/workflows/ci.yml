name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_call:
  # Weekly: deeper fuzzing with a fresh seed (printed in the test names, to reproduce).
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AGE_VERSION: v1.3.2

jobs:
  check:
    name: Format, lint, typecheck, build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:packages
      - name: Coverage
        run: npm run coverage
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            packages/ts-sdk/dist
            packages/ui/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }}, Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the reference age implementation (interoperability tests)
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) asset="linux-amd64.tar.gz" ;;
            Linux-ARM64) asset="linux-arm64.tar.gz" ;;
            macOS-ARM64) asset="darwin-arm64.tar.gz" ;;
            macOS-X64) asset="darwin-amd64.tar.gz" ;;
            Windows-X64) asset="windows-amd64.zip" ;;
            *) echo "no age build for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/age-dist"
          curl -fsSL -o "$RUNNER_TEMP/age-archive" "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-${asset}"
          if [[ "$asset" == *.zip ]]; then unzip -q "$RUNNER_TEMP/age-archive" -d "$RUNNER_TEMP/age-dist"; else tar -xzf "$RUNNER_TEMP/age-archive" -C "$RUNNER_TEMP/age-dist"; fi
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          echo "MSECRETS_AGE_BIN=$RUNNER_TEMP/age-dist/age/age$ext" >> "$GITHUB_ENV"
          echo "MSECRETS_AGE_KEYGEN_BIN=$RUNNER_TEMP/age-dist/age/age-keygen$ext" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/age-dist/age/age$ext" --version
      - run: npm ci
      - run: npm run build
      - name: Tests
        run: npm test
        env:
          MSECRETS_TEST_KEYCHAIN: ${{ runner.os != 'Linux' && '1' || '' }}
          MSECRETS_FUZZ_CASES: ${{ github.event_name == 'schedule' && '20000' || '' }}
          MSECRETS_FUZZ_SEED: ${{ github.event_name == 'schedule' && github.run_id || '' }}
      - name: Tests of the built packages
        run: npm run test:dist

  oldest-node:
    name: Built packages on Node.js 20 (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages
      - run: node --test --test-reporter=spec --test-timeout=120000 packages/ts-sdk/test-dist packages/ui/test-dist
