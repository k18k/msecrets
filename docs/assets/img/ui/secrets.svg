  <g transform="translate(330 146)"><rect width="1030" height="610" rx="10" class="panel"/><text x="24" y="48" class="txt h ink">Secrets</text><text x="24" y="78" class="txt body muted">Create, rename, delete, set, peek, share, and revoke encrypted values.</text><rect x="770" y="28" width="142" height="40" rx="8" class="btn"/><text x="792" y="53" class="txt body white">Create secret</text><rect x="926" y="28" width="80" height="40" rx="8" class="btn2"/><text x="949" y="53" class="txt body ink">Set</text><rect x="24" y="112" width="982" height="42" rx="8" fill="#f8fafc" stroke="#d9dee8"/><text x="48" y="139" class="txt body muted">Search secret name</text><line x1="24" y1="196" x2="1006" y2="196" class="line"/><text x="24" y="180" class="txt small muted">Name</text><text x="360" y="180" class="txt small muted">development</text><text x="560" y="180" class="txt small muted">Owners</text><text x="830" y="180" class="txt small muted">Actions</text><line x1="24" y1="270" x2="1006" y2="270" class="line"/><text x="24" y="240" class="txt body ink">DB_PASSWORD</text><rect x="360" y="218" width="90" height="30" rx="15" fill="#e7f7ef" stroke="#9bd7b6"/><text x="386" y="238" class="txt small ink">set</text><text x="560" y="238" class="txt small ink">A1B8F31D…C16E8EF0</text><rect x="830" y="214" width="64" height="34" rx="8" class="btn2"/><text x="849" y="236" class="txt small ink">Peek</text><rect x="902" y="214" width="70" height="34" rx="8" class="btn2"/><text x="921" y="236" class="txt small ink">Share</text><rect x="24" y="320" width="982" height="216" rx="10" fill="#fbfdff" stroke="#d9dee8"/><text x="48" y="360" class="txt h2 ink">Secret detail drawer</text><text x="48" y="392" class="txt body muted">Opening a row shows value status, ciphertext preview, owner fingerprints, and targeted actions without leaving the table.</text><rect x="48" y="430" width="250" height="72" rx="8" fill="#fff" stroke="#e5e7eb"/><text x="68" y="458" class="txt small muted">Ciphertext preview</text><text x="68" y="484" class="txt small ink">-----BEGIN PGP MESSAGE-----</text><rect x="322" y="430" width="250" height="72" rx="8" fill="#fff" stroke="#e5e7eb"/><text x="342" y="458" class="txt small muted">Runtime decrypt</text><text x="342" y="484" class="txt small ink">Requires matching private key</text></g>
