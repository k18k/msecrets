<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">msecrets UI keys screenshot</title>
  <desc id="desc">Recipient keys and runtime key workflow in the msecrets UI.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#111827" flood-opacity="0.14"/></filter><style>.bg{fill:#f6f7fb}.panel{fill:#fff;stroke:#d9dee8}.nav{fill:#f8fafc}.ink{fill:#1f2937}.muted{fill:#64748b}.line{stroke:#e5e7eb}.txt{font-family:Inter,Segoe UI,Arial,sans-serif}.h{font-weight:700;font-size:30px}.h2{font-weight:700;font-size:22px}.body{font-size:16px}.small{font-size:13px}.white{fill:#fff}.btn{fill:#228be6}.btn2{fill:#eef6ff;stroke:#b9d7fb}.green{fill:#e7f7ef;stroke:#9bd7b6}.yellow{fill:#fff6df;stroke:#efd38a}</style></defs>
  <rect class="bg" width="1440" height="960"/><rect x="40" y="36" width="1360" height="888" rx="22" class="panel" filter="url(#shadow)"/><rect x="40" y="36" width="1360" height="70" rx="22" fill="#fff"/><line x1="40" y1="106" x2="1400" y2="106" class="line"/><text x="72" y="80" class="txt h2 ink">msecrets</text><rect x="40" y="106" width="250" height="818" class="nav"/><line x1="290" y1="106" x2="290" y2="924" class="line"/>
  <text x="88" y="161" class="txt body muted">Overview</text><text x="88" y="213" class="txt body muted">Secrets</text><text x="88" y="268" class="txt body muted">Environments</text><rect x="62" y="290" width="206" height="42" rx="8" fill="#e7f5ff"/><text x="88" y="317" class="txt body ink">Recipient Keys</text><text x="88" y="372" class="txt body muted">Runtime Keys</text><text x="88" y="424" class="txt body muted">Raw JSON</text><text x="88" y="476" class="txt body muted">Diagnostics</text>
  <g transform="translate(330 146)"><rect width="1030" height="320" rx="10" class="panel"/><text x="24" y="48" class="txt h ink">Recipient Keys</text><text x="24" y="78" class="txt body muted">Committed OpenPGP public keys and ownership impact.</text><rect x="724" y="28" width="154" height="40" rx="8" class="btn"/><text x="746" y="53" class="txt body white">Import public key</text><rect x="892" y="28" width="114" height="40" rx="8" class="btn2"/><text x="914" y="53" class="txt body ink">Runtime key</text><rect x="24" y="112" width="982" height="42" rx="8" fill="#f8fafc" stroke="#d9dee8"/><text x="48" y="139" class="txt body muted">Search fingerprint or user ID</text><line x1="24" y1="196" x2="1006" y2="196" class="line"/><text x="24" y="180" class="txt small muted">Fingerprint</text><text x="380" y="180" class="txt small muted">User IDs</text><text x="740" y="180" class="txt small muted">Used by</text><text x="900" y="180" class="txt small muted">Actions</text><text x="24" y="240" class="txt body ink">A1B8F31D…C16E8EF0</text><text x="380" y="240" class="txt body ink">Krystian Mikołajczyk &lt;…&gt;</text><rect x="740" y="218" width="92" height="30" rx="15" class="green"/><text x="762" y="238" class="txt small ink">1 secret</text><rect x="900" y="214" width="84" height="34" rx="8" class="btn2"/><text x="919" y="236" class="txt small ink">Inspect</text>
    <rect x="0" y="360" width="500" height="250" rx="10" class="panel"/><text x="24" y="402" class="txt h2 ink">Public key import</text><text x="24" y="434" class="txt body muted">Adds portable armored OpenPGP public keys to the committed file so future values can be encrypted for explicit recipients.</text><rect x="24" y="474" width="452" height="88" rx="8" fill="#f8fafc" stroke="#d9dee8"/><text x="46" y="510" class="txt small ink">-----BEGIN PGP PUBLIC KEY BLOCK-----</text><text x="46" y="538" class="txt small muted">stored in .env.ms.json</text>
    <rect x="530" y="360" width="500" height="250" rx="10" class="panel"/><text x="554" y="402" class="txt h2 ink">Runtime private keys</text><text x="554" y="434" class="txt body muted">Imports private key material only into the local UI server process for peek/decrypt operations. Runtime keys are not written to the file.</text><rect x="554" y="474" width="452" height="54" rx="8" class="yellow"/><text x="576" y="507" class="txt body ink">In-memory only, cleared when the server exits.</text>
  </g>
</svg>
